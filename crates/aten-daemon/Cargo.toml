[package]
name = "aten-daemon"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
description = "ATEN daemon CLI"

[[bin]]
name = "aten"
path = "src/main.rs"

[dependencies]
aten-schema = { workspace = true }
aten-transcript = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
toml = { workspace = true }
chrono = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
aten-collector-linux = { workspace = true }
aten-attribution = { workspace = true }
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
aten-collector-windows = { workspace = true }
aten-attribution = { workspace = true }
windows = { version = "0.62", features = ["Win32_System_Console", "Win32_Foundation"] }
windows-service = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
aten-collector-macos = { workspace = true }
aten-attribution = { workspace = true }
libc = "0.2"
