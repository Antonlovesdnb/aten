[package]
name = "fishbowl-collector-linux"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
description = "Linux eBPF collector for fishbowl-v2"

# Only buildable on Linux — Cargo will refuse to compile on Windows hosts.
# The daemon depends on this crate behind a target_os = "linux" cfg.
[lib]
name = "fishbowl_collector_linux"
path = "src/lib.rs"

[dependencies]
fishbowl-schema = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
libbpf-rs = "0.24"
libc = "0.2"
plain = "0.2"

[build-dependencies]
libbpf-cargo = "0.24"
