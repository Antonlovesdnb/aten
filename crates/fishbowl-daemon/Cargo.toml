[package]
name = "fishbowl-daemon"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
description = "fishbowl-v2 daemon CLI"

[[bin]]
name = "fishbowl"
path = "src/main.rs"

[dependencies]
fishbowl-schema = { workspace = true }
fishbowl-transcript = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
toml = { workspace = true }
chrono = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
fishbowl-collector-linux = { workspace = true }
fishbowl-attribution = { workspace = true }
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
fishbowl-collector-windows = { workspace = true }
fishbowl-attribution = { workspace = true }
windows = { version = "0.62", features = ["Win32_System_Console", "Win32_Foundation"] }
windows-service = "0.8"
