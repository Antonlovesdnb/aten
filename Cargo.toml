[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Anton Ovrutsky <aovrutsky@gmail.com>"]
repository = "https://github.com/Antonlovesdnb/fishbowl-v2"
description = "Always-on cross-platform telemetry daemon for AI agent activity"

[workspace.dependencies]
fishbowl-schema = { path = "crates/fishbowl-schema" }
fishbowl-transcript = { path = "crates/fishbowl-transcript" }
fishbowl-collector-linux = { path = "crates/fishbowl-collector-linux" }
fishbowl-attribution = { path = "crates/fishbowl-attribution" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
