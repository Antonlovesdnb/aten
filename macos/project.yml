# XcodeGen spec for the macOS network-egress components.
#
# Two targets:
#   AtenHost   — the .app that activates the system extension and installs
#                    the content-filter configuration.
#   AtenNetExt — the NEFilterDataProvider system extension, embedded into
#                    the host's Contents/Library/SystemExtensions.
#
# Generate + build with ./build.sh (which runs `xcodegen generate` then
# `xcodebuild`). Paths are relative to this file (the macos/ directory).
#
# Signing is ad-hoc ("-") for free-account dev mode; see devsetup.sh. On a paid
# Developer Program account, set DEVELOPMENT_TEAM and a real CODE_SIGN_IDENTITY.

name: Aten
options:
  bundleIdPrefix: ai.aten
  deploymentTarget:
    macOS: "11.0"
  createIntermediateGroups: true

settings:
  base:
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"        # ad-hoc; dev mode honors entitlements w/ SIP off
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "5.0"
    ENABLE_HARDENED_RUNTIME: YES

targets:
  AtenHost:
    type: application
    platform: macOS
    sources:
      - path: AtenHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.aten.host
        PRODUCT_NAME: AtenHost
        INFOPLIST_FILE: AtenHost/Info.plist
        CODE_SIGN_ENTITLEMENTS: AtenHost/AtenHost.entitlements
    dependencies:
      - target: AtenNetExt
        embed: true            # → Contents/Library/SystemExtensions

  AtenNetExt:
    type: system-extension
    platform: macOS
    sources:
      - path: AtenNetExt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.aten.host.netext
        PRODUCT_NAME: AtenNetExt
        INFOPLIST_FILE: AtenNetExt/Info.plist
        CODE_SIGN_ENTITLEMENTS: AtenNetExt/AtenNetExt.entitlements
        OTHER_LDFLAGS: "$(inherited) -lbsm"
